templates:
  mini_kingdom:
    name: "Mini Kingdom"
    description: "Players shrink after entering; flight, invisibility and PvP are disabled."
    enter:
      title: "<green>Mini Kingdom"
      subtitle: "<gray>Restored automatically after leaving"
  event_plaza:
    name: "Event Plaza"
    description: "Lightweight event area; PvP and flight are disabled by default."
  run_race:
    name: "Running track"
    description: "Running/parkour race. Creation asks for the start and finish; checkpoints are optional and can be added in the GUI later."
    finish:
      text: "<gold>{player} finished in place #{rank} in {race_time_ms}ms."
  boat_race:
    name: "Boat track"
    description: "Boat race. Riders must sit in a boat for checkpoints and the finish to count. Creation asks for the start and finish."
    finish:
      text: "<gold>{player} reached the finish by boat in place #{rank}."
  horse_race:
    name: "Horse track"
    description: "Horse race. Riders must be on a horse for checkpoints and the finish to count. Creation asks for the start and finish."
    finish:
      text: "<gold>{player} reached the finish on horseback in place #{rank}."
  dual_pvp:
    name: "Duel arena"
    description: "Two players enter and everyone confirms to start; original gear is escrowed and a kit is handed out when the fight begins."
    start:
      title: "<red>Duel started"
      subtitle: "<gray>Gear is restored automatically after defeating your opponent"
    end:
      text: "<yellow>Duel ended; gear has been restored."
  union_war:
    name: "Nation battlefield"
    description: "Two nations field equal teams and fight to the last member. Creation asks for a return point plus one spawn per side."
    start:
      text: "<red>Nation battle started! Fight for your nation."
    end:
      text: "<yellow>Nation battle ended; gear has been restored."
  free_for_all:
    name: "Last-player-standing arena"
    description: "One life each; the last player standing wins. Creation asks for a return point and four spawns; add more on the mode page to raise the cap."
    start:
      text: "<red>The brawl begins! One life each — the last player standing wins."
    end:
      text: "<yellow>The brawl is over; gear has been restored."
  hide_and_seek:
    name: "Hide and seek arena"
    description: "Round-based mini game. Players ready up; seekers and hiders are assigned automatically. A seeker hitting a hider finds them without real damage."
    start:
      title: "<green>Hide and seek started"
      subtitle: "<gray>Seekers are released soon"
    assigned:
      text: "<yellow>Your role has been assigned; check the chat."
    found:
      text: "<gold>{player} was found."
    end:
      text: "<yellow>Mini game ended; temporary effects have been restored."
