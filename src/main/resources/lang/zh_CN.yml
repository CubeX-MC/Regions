lang-version: 11

prefix: "<#69DB7C>[Regions] "
help: |
  <#69DB7C>/regions gui <#CFD8DC>- 打开 Regions 管理界面
  <#69DB7C>/regions list <#CFD8DC>- 查看区域
  <#69DB7C>/regions create \<id> \<名称> --land \<领地> [area] <#CFD8DC>- 在自己的 Lands 区域创建场地
  <#69DB7C>/regions bind \<id> cuboid|lands ... <#CFD8DC>- 绑定区域来源
  <#69DB7C>/regions mode set \<id> dual_pvp|union_war|run_race|boat_race|horse_race|hide_and_seek ... <#CFD8DC>- 设置玩法
  <#69DB7C>/regions game [id] join|leave|ready|unready|spectate|status|result <#CFD8DC>- 报名、退出、准备、观战或查看（人在场地里时可不写 id）
  <#69DB7C>/regions game \<id> teams [编号|名字|me] [编号|名字] <#CFD8DC>- 指定工会战双方（不带参数列候选；me = 你当前编辑领地的国家；只写对手则甲方默认是你）
  <#69DB7C>/regions game \<id> start|end <#CFD8DC>- 裁判发令或强制结束比赛
  <#69DB7C>/regions language \<zh_CN|en_US|auto> <#CFD8DC>- 选择自己的显示语言（仅 locale-mode: player 时生效）
  <#69DB7C>/regions flag set \<id> \<flag> \<值> <#CFD8DC>- 设置规则
  <#69DB7C>/regions effect add \<id> \<effect> [参数] <#CFD8DC>- 添加区域效果
  <#69DB7C>/regions trial \<id> [start|stop] <#CFD8DC>- 仅对自己隔离试运行草稿的临时效果与场地规则
  <#69DB7C>/regions preview \<id> <#CFD8DC>- 查看依赖、冲突和最终有效规则
  <#69DB7C>/regions validate [id] <#CFD8DC>- 校验配置
  <#69DB7C>/regions inspect \<玩家> <#CFD8DC>- 查看玩家区域状态
  <#69DB7C>/regions cleanup \<玩家> <#CFD8DC>- 清理玩家区域状态
  <#69DB7C>/regions freeze|unfreeze \<id> [原因] <#CFD8DC>- 超级管理员冻结或复核解冻场地
  <#69DB7C>/regions audit [id] [条数] <#CFD8DC>- 超级管理员查看审计记录
  <#69DB7C>/regions reload <#CFD8DC>- 重载配置
help-publishing: |
  <#69DB7C>/regions publish|withdraw \<id> <#CFD8DC>- 发布草稿或撤回当前版本
  <#69DB7C>/regions history \<id> <#CFD8DC>- 查看不可变版本历史
  <#69DB7C>/regions rollback \<id> \<revision> <#CFD8DC>- 将历史版本发布为新 revision
  <#69DB7C>/regions archive \<id> <#CFD8DC>- 归档场地
help-player: "<#CFD8DC>直接输入 <#69DB7C>/regions<#CFD8DC> 打开活动大厅，或走进被设置过的领地体验。走进对战场地只会提示一次，报名要用 <#69DB7C>/regions game \\<场地> join<#CFD8DC>，站好后用 <#69DB7C>/regions game \\<场地> ready<#CFD8DC> 准备；中途退出用 <#69DB7C>leave<#CFD8DC>，想看别人打用 <#69DB7C>spectate<#CFD8DC>。服务器开启玩家语言时，可用 <#69DB7C>/regions language \\<zh_CN|en_US|auto><#CFD8DC> 换语言。"
