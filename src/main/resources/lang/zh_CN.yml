templates:
  mini_kingdom:
    name: "小人国"
    description: "玩家进入后缩小，禁飞、禁隐身、禁 PVP。"
    enter:
      title: "<green>小人国"
      subtitle: "<gray>离开区域后自动恢复"
  event_plaza:
    name: "活动广场"
    description: "轻量活动区域，默认禁 PVP 和禁飞。"
  run_race:
    name: "跑步赛道"
    description: "跑步/跑酷比赛。创建时会问你要起点和终点；检查点可选，之后在 GUI 里加。"
    finish:
      text: "<gold>{player} 完成比赛，名次 #{rank}，用时 {race_time_ms}ms。"
  boat_race:
    name: "划船赛道"
    description: "划船比赛。参赛者必须坐在船上才会记录检查点和终点。创建时会问你要起点和终点。"
    finish:
      text: "<gold>{player} 划船到达终点，名次 #{rank}。"
  horse_race:
    name: "骑马赛道"
    description: "骑马比赛。参赛者必须骑马才会记录检查点和终点。创建时会问你要起点和终点。"
    finish:
      text: "<gold>{player} 骑马到达终点，名次 #{rank}。"
  dual_pvp:
    name: "双人决斗场"
    description: "2 名玩家进入后全员确认开始，开战时扣押原装备并发放指定装备。"
    start:
      title: "<red>决斗开始"
      subtitle: "<gray>击败对手后会自动恢复装备"
    end:
      text: "<yellow>决斗结束，装备已恢复。"
  union_war:
    name: "工会战场"
    description: "两个国家的等额阵容对战，单命淘汰。创建时会问你要返回点和双方出生点。"
    start:
      text: "<red>工会战开始！代表你的国家活到最后。"
    end:
      text: "<yellow>工会战结束，装备已恢复。"
  free_for_all:
    name: "大乱斗场"
    description: "每人一条命，最后存活者获胜。创建时会问你要返回点和 4 个出生点；要开更多人请在玩法页补点。"
    start:
      text: "<red>大乱斗开始！每人一条命，最后存活者获胜。"
    end:
      text: "<yellow>大乱斗结束，装备已恢复。"
  hide_and_seek:
    name: "藏猫猫场地"
    description: "回合制小游戏。玩家进入后 ready，开局自动分配寻找者和隐藏者。寻找者攻击隐藏者即找到对方，不造成真实伤害。"
    start:
      title: "<green>藏猫猫开始"
      subtitle: "<gray>寻找者稍后释放"
    assigned:
      text: "<yellow>你的身份已经分配，请查看聊天提示。"
    found:
      text: "<gold>{player} 被找到了。"
    end:
      text: "<yellow>小游戏结束，临时状态已恢复。"
