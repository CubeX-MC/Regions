config-version: 4
language: zh_CN
# 玩家语言策略：server=全服统一使用上面的语言；player=玩家可用 /regions language 覆盖，
# 未选择时跟随客户端语言（仅 zh_CN/en_US，其余回退服务器语言）。
locale-mode: server

audit:
  max-events: 2000

modes:
  # 走进战斗场地时"这里可以报名"提示的冷却秒数。进入区域本身不等于报名（PLAN.md §5.3），
  # 所以提示会带冷却，避免每走一步刷屏；缺失时按 60 秒处理。
  entry-prompt-cooldown-seconds: 60
  # 比赛进行中（开赛屏障→回合间隔）允许选手使用的指令。
  # 默认只放行本插件的 /regions（退赛、查状态要用），其余一律拦下：
  # /spawn、/home、/tp、/l edit 这类指令在 PVP 里就是最短的逃跑通道。
  # 写根指令即可（不带 /）；`plugin:cmd` 形式会按去掉命名空间后的名字判定。
  # 场地自己的 `commands` Flag 不受影响，依旧生效。
  allowed-commands: []

publishing:
  keep-revisions: 20

integrations:
  union-provider: lands
  lands:
    enabled: true
    required-for-startup: false

governance:
  ruler-permission: regions.admin
  superadmin-permission: regions.superadmin

safety:
  watchdog-interval-seconds: 3
  cleanup-on-death: true
  cleanup-on-quit: true
  cleanup-on-reload: true
  max-actions-per-trigger: 16
  max-regions-per-player: 5
  # How often on_timer triggers fire for players inside a region. Values below 5 are raised to 5 so a
  # misconfigured venue cannot run action blocks every tick.
  timer-trigger-interval-seconds: 5

effects:
  refresh-interval-ticks: 60
  default-duration-ticks: 400
  scale:
    min: 0.1
    max: 4.0
    require-native-support: true

vanish:
  # Regions only suppresses vanilla invisibility by default. These keys are used for diagnostics when
  # an external vanish plugin marks a player as vanished.
  metadata-keys:
    - vanished
    - vanish
    - invisible

commands:
  root: regions
  aliases:
    - region
    - venue
