templates-version: 2

templates:
  mini_kingdom:
    name-key: templates.mini_kingdom.name
    description-key: templates.mini_kingdom.description
    mode:
      type: free_event
    flags:
      pvp:
        value: deny
      fly:
        value: deny
      vanish:
        value: deny
    effects:
      - type: scale
        value: 0.35
        scope: while_inside
    triggers:
      on_enter:
        - name: "入场提示"
          then:
            - type: title
              title-key: templates.mini_kingdom.enter.title
              subtitle-key: templates.mini_kingdom.enter.subtitle

  event_plaza:
    name-key: templates.event_plaza.name
    description-key: templates.event_plaza.description
    mode:
      type: free_event
    flags:
      pvp:
        value: deny
      fly:
        value: deny

  run_race:
    name-key: templates.run_race.name
    description-key: templates.run_race.description
    parameters:
      start:
        type: location
        required: true
      finish:
        type: location
        required: true
    mode:
      type: run_race
      min-players: 1
      start-mode: vote
      require-start: true
      radius: 2.5
      timeout-seconds: 300
      vehicle: none
      start: "${start}"
      finish: "${finish}"
      checkpoints: ""
      checkpoint-vehicles: ""
    flags:
      pvp:
        value: deny
      fly:
        value: deny
    triggers:
      on_finish:
        - name: "完赛提示"
          then:
            - type: broadcast
              text-key: templates.run_race.finish.text

  boat_race:
    name-key: templates.boat_race.name
    description-key: templates.boat_race.description
    parameters:
      start:
        type: location
        required: true
      finish:
        type: location
        required: true
    mode:
      type: boat_race
      min-players: 1
      start-mode: vote
      require-start: true
      radius: 3.0
      timeout-seconds: 300
      vehicle: boat
      start: "${start}"
      finish: "${finish}"
      checkpoints: ""
      checkpoint-vehicles: ""
    flags:
      pvp:
        value: deny
      fly:
        value: deny
    triggers:
      on_finish:
        - name: "完赛提示"
          then:
            - type: broadcast
              text-key: templates.boat_race.finish.text

  horse_race:
    name-key: templates.horse_race.name
    description-key: templates.horse_race.description
    parameters:
      start:
        type: location
        required: true
      finish:
        type: location
        required: true
    mode:
      type: horse_race
      min-players: 1
      # start-mode: judge —— 开赛由裁判发令，也就是任何能管理本场地的人执行
      # /regions game <id> start。这里不要写 judges：RaceModeService.canJudge 只看
      # authority().canManage()，那个字段任何模式服务都不读，填了会让人以为名单生效了。
      start-mode: judge
      require-start: true
      radius: 3.0
      timeout-seconds: 300
      vehicle: horse
      start: "${start}"
      finish: "${finish}"
      checkpoints: ""
      checkpoint-vehicles: ""
    flags:
      pvp:
        value: deny
      fly:
        value: deny
    triggers:
      on_finish:
        - name: "完赛提示"
          then:
            - type: broadcast
              text-key: templates.horse_race.finish.text

  dual_pvp:
    name-key: templates.dual_pvp.name
    description-key: templates.dual_pvp.description
    parameters:
      respawn:
        type: location
        required: true
      spawn-a:
        type: location
        required: true
      spawn-b:
        type: location
        required: true
    mode:
      type: dual_pvp
      min-players: 2
      max-players: 2
      best-of: 1
      round-seconds: 180
      intermission-seconds: 5
      require-ready: true
      replace-gear: true
      kit: "IRON_SWORD:1,BOW:1,ARROW:16,COOKED_BEEF:8"
      armor: "IRON_BOOTS:1,IRON_LEGGINGS:1,IRON_CHESTPLATE:1,IRON_HELMET:1"
      offhand: "SHIELD:1"
      spawn-points: "${spawn-a};${spawn-b}"
      respawn: "${respawn}"
    flags:
      pvp:
        value: allow
      item_drop:
        value: deny
      fly:
        value: deny
    triggers:
      on_mode_start:
        - name: "开战提示"
          then:
            - type: title
              title-key: templates.dual_pvp.start.title
              subtitle-key: templates.dual_pvp.start.subtitle
      on_mode_end:
        - name: "结束提示"
          then:
            - type: message
              text-key: templates.dual_pvp.end.text

  free_for_all:
    name-key: templates.free_for_all.name
    description-key: templates.free_for_all.description
    parameters:
      respawn:
        type: location
        required: true
      spawn-1:
        type: location
        required: true
      spawn-2:
        type: location
        required: true
      spawn-3:
        type: location
        required: true
      spawn-4:
        type: location
        required: true
    mode:
      type: free_for_all
      # 出生点数量必须不少于上限人数，所以模板先给 4 人场；要开到 16 人在玩法页继续补点。
      min-players: 4
      max-players: 4
      timeout-seconds: 600
      require-ready: true
      replace-gear: true
      kit: "IRON_SWORD:1,BOW:1,ARROW:16,COOKED_BEEF:8"
      armor: "IRON_BOOTS:1,IRON_LEGGINGS:1,IRON_CHESTPLATE:1,IRON_HELMET:1"
      offhand: "SHIELD:1"
      spawn-points: "${spawn-1};${spawn-2};${spawn-3};${spawn-4}"
      respawn: "${respawn}"
    flags:
      pvp:
        value: allow
      item_drop:
        value: deny
      fly:
        value: deny
    triggers:
      on_mode_start:
        - name: "开战提示"
          then:
            - type: broadcast
              text-key: templates.free_for_all.start.text
      on_mode_end:
        - name: "结束提示"
          then:
            - type: message
              text-key: templates.free_for_all.end.text

  union_war:
    name-key: templates.union_war.name
    description-key: templates.union_war.description
    parameters:
      respawn:
        type: location
        required: true
      spawn-a:
        type: location
        required: true
      spawn-b:
        type: location
        required: true
    mode:
      type: union_war
      team-size: 5
      min-unions: 2
      timeout-seconds: 600
      require-ready: true
      replace-gear: true
      kit: "IRON_SWORD:1,BOW:1,ARROW:32,COOKED_BEEF:16"
      armor: "IRON_BOOTS:1,IRON_LEGGINGS:1,IRON_CHESTPLATE:1,IRON_HELMET:1"
      offhand: "SHIELD:1"
      # 每队先给一个集合起点；在玩法页用"添加甲方/乙方出生点"补到每队人数。
      spawn-points: "${spawn-a}"
      spawn-points-b: "${spawn-b}"
      respawn: "${respawn}"
      # 可选奖励请在套用模板后设置 reward-source: contract 与 reward-contract: <WAGER id>。
      # 模板不预填合同 id，避免把同一个资金凭证复制到多个场地。
    flags:
      pvp:
        value: allow
      item_drop:
        value: deny
      fly:
        value: deny
    triggers:
      on_mode_start:
        - name: "工会战开战"
          then:
            - type: broadcast
              text-key: templates.union_war.start.text
      on_mode_end:
        - name: "工会战结束"
          then:
            - type: broadcast
              text-key: templates.union_war.end.text

  hide_and_seek:
    name-key: templates.hide_and_seek.name
    description-key: templates.hide_and_seek.description
    parameters:
      respawn:
        type: location
        required: true
    mode:
      type: hide_and_seek
      min-players: 2
      max-players: 12
      start-mode: vote
      vote-start-percent: 1.0
      seekers: 1
      hide-seconds: 30
      round-seconds: 300
      found-becomes-seeker: true
      replace-gear: false
      respawn: "${respawn}"
    flags:
      pvp:
        value: allow
      item_drop:
        value: deny
      fly:
        value: deny
      vanish:
        value: deny
    triggers:
      on_mode_start:
        - name: "小游戏开始"
          then:
            - type: title
              title-key: templates.hide_and_seek.start.title
              subtitle-key: templates.hide_and_seek.start.subtitle
      on_role_assigned:
        - name: "身份已分配"
          then:
            - type: message
              text-key: templates.hide_and_seek.assigned.text
      on_found:
        - name: "玩家被找到"
          then:
            - type: broadcast
              text-key: templates.hide_and_seek.found.text
      on_mode_end:
        - name: "小游戏结束"
          then:
            - type: message
              text-key: templates.hide_and_seek.end.text
