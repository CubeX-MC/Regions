name: Regions
version: ${project.version}
main: org.cubexmc.regions.RegionsPlugin
api-version: '1.21.11'
folia-supported: true
author: CubeX-MC
description: Region-powered venue framework for RuleGems rulers and server events.
softdepend: [Lands, RuleGems, Contract]

permissions:
  regions.use:
    default: true
    description: >-
      Take part in Region activities (/regions game ... join|ready|spectate|status).
      Revoke it to keep a group out of everyone else's events; hosting is gated
      separately by region ownership, not by this node.
    children:
      regions.game.view: true
      regions.game.join: true
      regions.game.ready: true
      regions.game.spectate: true
      regions.language.select: true
  regions.game.view:
    default: true
    description: View a venue's match status (/regions game <id> status).
  regions.game.join:
    default: true
    description: >-
      Sign up for a venue's match (/regions game <id> join). Entering the area is
      not consent; only this node plus the command signs you up. You can always
      leave a match you joined.
  regions.game.ready:
    default: true
    description: Ready up / unready for a match (/regions game <id> ready|unready).
  regions.game.spectate:
    default: true
    description: Watch a running match from the configured spectator spot (/regions game <id> spectate).
  regions.language.select:
    default: true
    description: >-
      Pick your own display language (/regions language zh_CN|en_US|auto).
      Only does anything while config.yml has locale-mode: player.
  regions.admin:
    default: op
    description: RuleGems ruler access; Region ownership is still required.
    children:
      regions.use: true
      regions.region.create: true
      regions.region.edit: true
      regions.region.remove: true
      regions.region.enable: true
      regions.region.bind: true
      regions.validate: true
      regions.region.publish: true
      regions.region.rollback: true
      regions.region.archive: true
      regions.game.start: true
      regions.game.end: true
  regions.game.start:
    default: false
    description: Judge start for an authorised venue; venue-owner/superadmin judgement still applies.
  regions.game.end:
    default: false
    description: Force-end a match; venue-owner/superadmin judgement still applies.
  regions.superadmin:
    default: op
    description: Emergency global Regions administration and ownership bypass.
    children:
      regions.use: true
      regions.reload: true
      regions.inspect: true
      regions.cleanup: true
      regions.bypass.limit: true
      regions.bypass.flags: true
  regions.reload:
    default: op
    description: >-
      Reload Regions. Grantable on its own: holders do not need the full
      regions.superadmin. Rulers do NOT get it implicitly.
  regions.region.create:
    default: op
    description: Create Regions.
  regions.region.edit:
    default: op
    description: Edit Regions.
  regions.region.remove:
    default: op
    description: Remove Regions.
  regions.region.enable:
    default: op
    description: Enable or disable Regions.
  regions.region.bind:
    default: op
    description: Bind external region sources.
  regions.region.publish:
    default: op
    description: Publish or withdraw owned Region drafts.
  regions.region.rollback:
    default: op
    description: View and restore owned Region revisions.
  regions.region.archive:
    default: op
    description: Archive owned Regions.
  regions.inspect:
    default: op
    description: >-
      Inspect player Region sessions. Grantable on its own: holders do not need
      the full regions.superadmin. Rulers do NOT get it implicitly.
  regions.cleanup:
    default: op
    description: >-
      Cleanup player Region state. Grantable on its own: holders do not need the
      full regions.superadmin. Rulers do NOT get it implicitly.
  regions.validate:
    default: op
    description: Validate Region configuration.
  regions.bypass.limit:
    default: op
    description: Bypass Region creation limits.
  regions.bypass.flags:
    default: op
    description: Bypass Region flags.
